<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Totalizador de ventas</title>
  </head>
  <body>
    <h1>Totalizador de ventas</h1>
    <form id="ventas-form">
      <label for="cantidad">Cantidad :</label>
      <input type="number" id="cantidad">
      <br><br>
      <label for="precio">Precio por unidad:</label>
      <input type="number" id="precio" step="0.01">
      <br><br>
      <label for="estado">Código de estado:</label>
      <select id="estado">
        <option value="CA">California (CA)</option>
        <option value="UT">Utah (UT)</option>
        <option value="NV">Nevada (NV)</option>
        <option value="TX">Texas (TX)</option>
        <option value="AL">Alabama (AL)</option>
      </select>
      <br><br>
      <input type="submit" value="Totalizar" id="totalizar-button">
      <input type="button" value="Cancelar" id="cancelar-button">
    </form>
    <div id="resultado-div"></div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
